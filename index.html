.homeInner{position:absolute;inset:48px 0 0;padding:16px 18px 116px;overflow:auto}
.homeDate{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.65);margin:5px 0 24px}
.homeDate .d{font-size:33px;font-weight:800;line-height:1.05}
.homeDate .s{font-size:15px;margin-top:6px}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 14px}
.app{position:relative;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.appBtn{border:0;background:transparent;color:inherit;width:100%;padding:0}
.ico{width:58px;height:58px;border-radius:14px;background:#fff;margin:0 auto 7px;display:grid;place-items:center;font-size:28px;box-shadow:0 3px 12px rgba(0,0,0,.22);text-shadow:none;color:#111}
.badge{position:absolute;top:-6px;right:7px;min-width:22px;height:22px;border-radius:12px;background:#ff3b30;color:#fff;border:2px solid #fff;display:grid;place-items:center;font-size:11px;text-shadow:none}
.dock{position:absolute;left:18px;right:18px;bottom:18px;height:80px;border-radius:26px;background:rgba(255,255,255,.26);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-around}
.dock button{border:0;background:transparent;padding:0}

/* APP SHEET */
#appSheet{position:absolute;inset:48px 0 0;background:#f6f6f8;z-index:100;overflow:auto}
.header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;position:sticky;top:0;z-index:20}
.header .title{font-size:21px;font-weight:800;margin:0 auto}
.back{border:0;background:transparent;font-size:31px;width:38px;height:38px}
.headRight{min-width:38px;text-align:right}
.listRow{background:#fff;border-bottom:1px solid #eee;padding:13px 14px;display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:#e1e7ed;display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.rmain{flex:1;min-width:0}
.rtop{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:800} .t{font-size:12px;color:#999}
.prev{font-size:14px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}

.chat{background:#b6cadb;min-height:calc(100% - 58px);padding:10px 12px 88px}
.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.msg.me{justify-content:flex-end}
.smallAv{width:36px;height:36px;border-radius:50%;background:#e2e7ed;display:grid;place-items:center}
.bubble{max-width:78%;padding:11px 13px;border-radius:15px;background:#fff;font-size:15px;line-height:1.45;word-break:break-word}
.msg.me .bubble{background:var(--kkt)}
.meta{font-size:11px;color:#65717a;margin-top:3px}
.inputbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,var(--w));padding:10px 12px;background:#fff;border-top:1px solid #ddd;display:flex;gap:8px;z-index:150}
.inputbar textarea{flex:1;border:0;background:#f0f0f3;border-radius:18px;padding:10px 12px;resize:none;outline:none;font-size:16px;min-height:40px;max-height:88px}
.send{border:0;background:var(--kkt);border-radius:18px;padding:8px 13px;font-weight:800}
.plus{border:0;background:transparent;font-size:24px}

.card{background:#fff;margin:12px;border-radius:18px;padding:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#fff;padding:3px}
.photo{aspect-ratio:1;background:linear-gradient(135deg,#d1bea8,#758b98);display:grid;place-items:center;font-size:32px;position:relative}
.photo span{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.38);color:#fff;font-size:11px;padding:3px 5px;border-radius:5px}
.devicePage{background:#151515;color:#fff;min-height:100%;padding:28px 20px}
.devicePage h2{text-align:center;margin-top:20px}
.devices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.device{border:2px solid #444;border-radius:23px;padding:18px 10px;text-align:center;background:#111}
.device.locked{opacity:.42}
.ph{font-size:44px}
.observe{color:#58d68d;font-size:13px;margin-top:7px}
.note{background:#fff;padding:14px 16px;border-bottom:1px solid #eee}
.note h3{margin:0 0 4px} .note p{margin:0;color:#888}
.storybar{display:flex;gap:11px;padding:12px;overflow:auto;background:#fff;border-bottom:1px solid #eee}
.story{min-width:62px;text-align:center;font-size:11px}
.ring{width:56px;height:56px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#ffcc4d,#ff3d77,#8b4df7);margin:auto auto 4px}
.ringin{width:100%;height:100%;border-radius:50%;background:#ddd;border:2px solid #fff;display:grid;place-items:center;font-size:23px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:22px}
.modal{width:100%;background:#fff;border-radius:24px;padding:20px}
.modal button{border:0;border-radius:16px;padding:10px 14px;margin-top:12px}
#toast{position:absolute;top:58px;left:14px;right:14px;background:rgba(30,30,33,.96);color:#fff;border-radius:16px;padding:12px 14px;z-index:190;display:none;box-shadow:0 10px 24px rgba(0,0,0,.25)}

/* v2 stable feature layer */
.mediaPanel{position:absolute;left:12px;right:12px;bottom:78px;background:#fff;border-radius:22px;padding:12px;z-index:170;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.mediaGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mediaGrid button{border:0;background:#f2f2f5;border-radius:15px;padding:12px 4px;font-size:12px}
.mediaGrid .mi{display:block;font-size:26px;margin-bottom:4px}
.mediaBubble{max-width:230px;border-radius:14px;overflow:hidden;background:#fff}
.mediaBubble img,.mediaBubble video{width:100%;max-height:260px;object-fit:cover;display:block}
.audioBubble{display:flex;align-items:center;gap:8px;min-width:180px}
.audioBubble button{border:0;background:transparent;font-size:20px}
.voiceRecorder{position:absolute;left:12px;right:12px;bottom:78px;background:#fff;border-radius:22px;padding:16px;z-index:175;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.recDot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3b30;margin-right:7px}
.videoCall{position:absolute;inset:0;background:#111;z-index:220;color:#fff}
.videoMain{position:absolute;inset:0;background:linear-gradient(160deg,#20242b,#4b5969);display:flex;align-items:center;justify-content:center;font-size:84px}
.videoSelf{position:absolute;right:14px;top:70px;width:108px;height:155px;border-radius:16px;background:linear-gradient(145deg,#4e4e53,#a6a6aa);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font-size:44px}
.videoTop{position:absolute;top:22px;left:0;right:0;text-align:center}
.videoTop b{font-size:24px}.videoTop div{font-size:13px;color:#ddd;margin-top:4px}
.videoControls{position:absolute;bottom:38px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.videoControls button{width:62px;height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px}.videoControls .hang{background:#ff3b30}

const MEDIA_DB='songqing_phone_media_v14',MEDIA_STORE='media';
let mediaDBPromise=null;const objectUrlCache={};
function openMediaDB(){
 if(mediaDBPromise)return mediaDBPromise;
 mediaDBPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(MEDIA_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return mediaDBPromise;
}
async function storeMediaFile(file){const db=await openMediaDB();const id='med_'+Date.now()+'_'+Math.random().toString(36).slice(2);await new Promise((res,rej)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return {mediaId:id,name:file.name||'',mime:file.type||'',size:file.size||0};}
async function mediaUrl(id){if(objectUrlCache[id])return objectUrlCache[id];const db=await openMediaDB();const blob=await new Promise((res,rej)=>{const r=db.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!blob)return '';const url=URL.createObjectURL(blob);objectUrlCache[id]=url;return url;}
async function hydrateMedia(root=document){const nodes=[...root.querySelectorAll('[data-media-id]')];for(const el of nodes){const id=el.dataset.mediaId;if(!id)continue;const url=await mediaUrl(id).catch(()=> '');if(url){if(el.tagName==='IMG'||el.tagName==='VIDEO'||el.tagName==='AUDIO')el.src=url;else el.style.backgroundImage=`url("${url}")`;}}}
async function clearMediaDB(){try{const db=await openMediaDB();await new Promise((res,rej)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}

let recorder=null,chunks=[],recStart=0;
$('#startRec').addEventListener('click',async()=>{
 try{
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 recorder=new MediaRecorder(stream);chunks=[];recStart=Date.now();
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:'audio/webm'});const data=await fileToDataURL(blob);const sec=Math.max(1,Math.round((Date.now()-recStart)/1000));state.rikuMedia.push({type:'audio',data,duration:'0:'+String(sec).padStart(2,'0')});save();$('#voiceRecorder').classList.add('hidden');renderRiku();};
 recorder.start();$('#recText').textContent='录音中…';
 }catch(e){$('#recText').textContent='麦克风权限不可用，请改用语音文件上传';}
});
